name: Keep Supabase awake

# Supabase free projects pause after a week with no activity.
# This visits the database every 3 days so the app never goes to sleep.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the database
        run: |
          curl -sS -o /dev/null -w "Supabase answered: %{http_code}\n" \
            "https://mvuokgoidtnhxodrdmno.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_pF_f-s3nEfu-mK2StxZQ2g_ccUIJsFS"
