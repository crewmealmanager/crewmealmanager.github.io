<!-- ===================== ALLOCATION ENGINE (pure functions, no DOM) ===================== -->
<script id="engine">
var CAP = 40;
var KEYS = ['A', 'B', 'C'];

function toInt(v) { v = Math.floor(Number(v)); return isFinite(v) && v > 0 ? v : 0; }
function specialsTotal(cart) { return cart.specials.reduce(function (s, x) { return s + toInt(x.qty); }, 0); }
function stdTotal(cart) { return KEYS.reduce(function (s, k) { return s + toInt(cart.std[k]); }, 0); }
function cartTotal(cart) { return specialsTotal(cart) + stdTotal(cart); }
/* Each cart holds 40 unless the user lowered it for that cart. */
function capOf(cart) { var c = toInt(cart && cart.cap); return c >= 1 && c <= CAP ? c : CAP; }

/* Distribute standard meals across carts.
   - Special meals stay where the user put them and reduce that cart's free space.
   - One casserole at a time: take the choice with the most still unplaced, put it in the
     cart where that choice is currently thinnest relative to the cart's free space.
   - Never exceeds 40 per cart, never invents or loses a meal; leftovers are returned as unallocated. */
function distribute(totals, carts) {
  var n = carts.length;
  var cap = carts.map(function (c) { return Math.max(0, capOf(c) - specialsTotal(c)); });
  var free = cap.slice();
  var alloc = carts.map(function () { return { A: 0, B: 0, C: 0 }; });
  var left = { A: toInt(totals.A), B: toInt(totals.B), C: toInt(totals.C) };
  while (true) {
    var k = null;
    KEYS.forEach(function (key) { if (left[key] > 0 && (k === null || left[key] > left[k])) k = key; });
    if (k === null) break;
    var best = -1, bestScore = Infinity;
    for (var i = 0; i < n; i++) {
      if (free[i] <= 0) continue;
      var score = (alloc[i][k] + 1) / Math.max(1, cap[i]);
      if (score < bestScore - 1e-12 || (Math.abs(score - bestScore) <= 1e-12 && free[i] > free[best])) {
        best = i; bestScore = score;
      }
    }
    if (best === -1) break; // no space left anywhere
    alloc[best][k]++; free[best]--; left[k]--;
  }
  return { alloc: alloc, unallocated: left };
}

function allocatedTotals(carts) {
  var t = { A: 0, B: 0, C: 0 };
  carts.forEach(function (c) { KEYS.forEach(function (k) { t[k] += toInt(c.std[k]); }); });
  return t;
}

/* Largest value a user may type into one cart's standard field:
   limited by the cart's 40 capacity and by how many of that choice are still unplaced. */
function manualMax(totals, carts, ci, k) {
  var cart = carts[ci];
  var current = toInt(cart.std[k]);
  var room = capOf(cart) - (cartTotal(cart) - current);
  var unplaced = toInt(totals[k]) - allocatedTotals(carts)[k];
  return Math.max(0, Math.min(room, current + Math.max(0, unplaced)));
}

/* Largest quantity allowed for one special meal line (specials alone may not exceed 40). */
function specialMax(cart, si) {
  return Math.max(0, capOf(cart) - (specialsTotal(cart) - toInt(cart.specials[si].qty)));
}

/* Remove standard meals from a cart until it fits in 40 (largest choice first).
   Removed meals become unallocated. Used when automatic distribution is paused. */
function trimCart(cart) {
  var over = cartTotal(cart) - capOf(cart);
  while (over > 0) {
    var k = null;
    KEYS.forEach(function (key) { if (toInt(cart.std[key]) > 0 && (k === null || cart.std[key] > cart.std[k])) k = key; });
    if (k === null) break;
    cart.std[k] = toInt(cart.std[k]) - 1; over--;
  }
}
</script>

  /* ---------- flight screen ---------- */

  var CART_NAMES = ['L3', 'R3', 'L3A', 'R3A', 'L4', 'R4', 'L4A', 'R4A', 'L4C', 'R4C', 'L5', 'R5', 'L5A', 'R5A', 'R5C', 'L2', 'R2', 'L2A', 'R2A'];
  function cartNameHTML(f, i) {
    var c = f.carts[i], name = (c.name || '').trim().toUpperCase();
    var manual = !!c.manualName || (name !== '' && CART_NAMES.indexOf(name) < 0);
    var used = {};
    f.carts.forEach(function (o, j) { if (j !== i && o.name) used[o.name.trim().toUpperCase()] = true; });
    var h = '<select class="cartsel' + (!name && !manual ? ' empty' : '') + '" data-f="cartsel" data-ci="' + i + '" aria-label="Cart name">' +
      '<option value=""' + (!name && !manual ? ' selected' : '') + '>Choose cart</option>';

    return h;
  }
  var SP_NAMES = ['AVML', 'HNML', 'VOML', 'VGML', 'VJML', 'VLML', 'LCML', 'LFML', 'GFML', 'BLML', 'CHML', 'CVML', 'KSML', 'RVML', 'NLML', 'DBML', 'MOML'];
  function spNameHTML(i, si, s) {
    var name = (s.name || '').trim().toUpperCase();
    var manual = !!s.manualName || (name !== '' && SP_NAMES.indexOf(name) < 0);
    var h = '<select class="cartsel spsel' + (!name && !manual ? ' empty' : '') + '" data-f="spsel" data-ci="' + i + '" data-si="' + si + '" aria-label="Special meal">' +
      '<option value=""' + (!name && !manual ? ' selected' : '') + '>Meal</option>';
    SP_NAMES.forEach(function (n) { h += '<option value="' + n + '"' + (!manual && name === n ? ' selected' : '') + '>' + n + '</option>'; });
    h += '<option value="__other"' + (manual ? ' selected' : '') + '>Other (type it)…</option></select>';
    return { sel: h, manual: manual ? '<input class="spn upper sp-manual" data-f="spn" data-ci="' + i + '" data-si="' + si + '" autocapitalize="characters" autocomplete="off" maxlength="12" placeholder="Type meal code" value="' + esc(s.name) + '">' : '' };
  }
  var SP_QTY_MAX = 25;
  function spQtyHTML(c, i, si, s) {
    var q = toInt(s.qty), max = specialMax(c, si);
    var manual = !!s.manualQty || q > SP_QTY_MAX;
    var h = '<select class="cartsel qtysel' + (manual ? ' is-other' : '') + '" data-f="spqsel" data-ci="' + i + '" data-si="' + si + '" aria-label="Special meal quantity">' +
      '<option value="__other"' + (manual ? ' selected' : '') + '>Other</option>';
    if (!manual && q === 0) h += '<option value="0" selected>0</option>';
    for (var n = 1; n <= SP_QTY_MAX; n++) h += '<option value="' + n + '"' + (!manual && q === n ? ' selected' : '') + (n > max ? ' disabled' : '') + '>' + n + '</option>';
    h += '</select>';
    var inp = manual ? '<input class="num qty-manual" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" data-f="spq" data-ci="' + i + '" data-si="' + si + '" placeholder="Type quantity" aria-label="Special meal quantity" value="' + (q || '') + '">' : '';
    return h + inp;
  }
  function capSelHTML(c, i) {
    var cp = capOf(c), h = '<label class="rows-row"><span>Max meals</span><select class="cartsel capsel" data-f="cap" data-ci="' + i + '" aria-label="Maximum meals in this cart">';
    for (var n = CAP; n >= 1; n--) h += '<option value="' + n + '"' + (n === cp ? ' selected' : '') + '>' + n + '</option>';
    return h + '</select></label>';
  }
  function spaceText(f) {
    var caps = f.carts.map(capOf), sum = caps.reduce(function (a, b) { return a + b; }, 0);
    return caps.every(function (x) { return x === caps[0]; }) ? sum + ' (' + caps.length + ' × ' + (caps[0] || CAP) + ')' : String(sum);
  }
  function cartHTML(f, i) {
    var c = f.carts[i];
    var h = '<div class="card cart" id="cart-' + i + '">' +
      '<div class="cart-head">' + cartNameHTML(f, i) +
      '<span class="pill ok" id="pill-' + i + '"></span></div>' +
      capSelHTML(c, i) + '<label class="rows-row"><span>Rows</span><input data-f="rows" data-ci="' + i + '" class="rows-in" inputmode="text" autocomplete="off" maxlength="20" placeholder="e.g. 30-35" value="' + esc(c.rows || '') + '"></label>';
    h += '<div class="sub" style="margin-top:0">Standard meals</div>';

      h += '<div class="row"><span class="tag">' + k + '</span><span class="lbl" data-cl="' + k + '"></span>' +

    });

    c.specials.forEach(function (s, si) {
      var sp = spNameHTML(i, si, s);
      h += '<div class="sp-row">' + sp.sel + sp.manual +
        spQtyHTML(c, i, si, s) +
        '<button class="x" data-act="delsp" data-ci="' + i + '" data-si="' + si + '" aria-label="Remove special meal">×</button></div>';
    });
    h += '<button class="btn ghost small" data-act="addsp" data-ci="' + i + '">+ Special Meal</button>';
    h += '<div class="sub">Notes</div><textarea class="cart-notes" data-f="notes" data-ci="' + i + '" rows="2" maxlength="300" placeholder="Anything to remember…">' + esc(c.notes || '') + '</textarea>';
    h += '<div class="cart-foot"><span id="foot-' + i + '"></span><span class="big" id="tot-' + i + '"></span></div></div>';
    return h;
  }

  function summaryHTML(f) {
    var t = totals(f), a = allocatedTotals(f.carts);
    var reqT = t.A + t.B + t.C, alT = a.A + a.B + a.C;
    var spT = f.carts.reduce(function (s, c) { return s + specialsTotal(c); }, 0);
    var h = '';
    h += '<div class="mode"><span class="dot' + (f.autoMode ? '' : ' off') + '"></span>' +
      (f.autoMode ? 'Automatic distribution is on' : 'Manual changes kept — automatic distribution paused') + '</div>';

    var un = 0, ov = 0;
    KEYS.forEach(function (k) { var d = t[k] - a[k]; if (d > 0) un += d; else ov -= d; });
    if (ov > 0) {
      h += '<div class="notice bad">' + ov + ' more standard meal' + (ov === 1 ? ' is' : 's are') + ' in carts than requested. Lower cart quantities or redistribute.</div>';
    }
    if (un > 0) {
      var cap = f.carts.reduce(function (s, c) { return s + Math.max(0, capOf(c) - cartTotal(c)); }, 0);
      if (f.autoMode || cap === 0) {
        h += '<div class="notice bad">' + un + ' meal' + (un === 1 ? '' : 's') + ' unallocated — not enough cart space. Add carts or reduce quantities.</div>';
      } else {
        h += '<div class="notice warn">' + un + ' meal' + (un === 1 ? ' is' : 's are') + ' not in any cart yet. Add them manually or redistribute.</div>';
      }
    }
    if (un === 0 && ov === 0 && reqT > 0) h += '<div class="notice ok">All ' + reqT + ' standard meals are allocated.</div>';
    var spReq = toInt(f.spmlTotal), spLeft = spReq - spT;
    if (spReq > 0 && spLeft > 0) h += '<div class="notice warn">' + spLeft + ' special meal' + (spLeft === 1 ? ' is' : 's are') + ' not in a cart yet. Add ' + (spLeft === 1 ? 'it' : 'them') + ' in the carts below.</div>';
    if (spReq > 0 && spLeft < 0) h += '<div class="notice bad">' + (-spLeft) + ' more special meal' + (spLeft === -1 ? ' is' : 's are') + ' in carts than the SPML total (' + spReq + ').</div>';

    h += '<div class="card"><table class="sum"><tr><th>Choice</th><th>Requested</th><th>Allocated</th><th>Left</th></tr>';
    KEYS.forEach(function (k) {
      var d = t[k] - a[k];
      h += '<tr><td>' + k + ' · ' + esc(cname(f, k)) + '</td><td>' + t[k] + '</td><td>' + a[k] + '</td><td class="' + (d === 0 ? 'green' : 'red') + '">' + d + '</td></tr>';
    });
    var showSp = spReq > 0 || spT > 0, rT = reqT + (showSp ? spReq : 0), aT = alT + (showSp ? spT : 0);
    if (showSp) h += '<tr><td>SPML</td><td>' + spReq + '</td><td>' + spT + '</td><td class="' + (spLeft === 0 ? 'green' : 'red') + '">' + spLeft + '</td></tr>';
    h += '<tr class="tot"><td>Total</td><td>' + rT + '</td><td>' + aT + '</td><td class="' + (rT === aT ? 'green' : 'red') + '">' + (rT - aT) + '</td></tr></table>' +
      '<p class="hint">Special meals: ' + spT + ' · Cart space: ' + spaceText(f) + '</p></div>';

    h += '<div class="card ctw"><table class="ct"><thead><tr><th>Cart</th>';
    KEYS.forEach(function (k) { h += '<th class="n">' + esc((f.choices[k].name || '').trim() || k) + '</th>'; });
    h += '<th class="sp">Special</th><th class="n">Total</th></tr></thead>';
    f.carts.forEach(function (c, i) {
      var tot = cartTotal(c), cp = capOf(c), bad = tot > cp;
      var chips = c.specials.filter(function (x) { return toInt(x.qty) > 0; }).map(function (x) {
        var code = (x.name || '').trim().toUpperCase().slice(0, 2) || 'SP';
        return '<span class="spc">' + esc(code) + ' ' + toInt(x.qty) + '</span>';
      }).join('');
      var note = (c.notes || '').trim();
      h += '<tbody><tr' + (note ? ' class="hasnote"' : '') + '><td class="cn"><div class="nm">' + esc(cartLabel(c, i).toUpperCase()) + '</div>' +
        ((c.rows || '').trim() ? '<div class="rws">Rows ' + esc(c.rows.trim()) + '</div>' : '') + '</td>';
      KEYS.forEach(function (k) { h += '<td class="n">' + toInt(c.std[k]) + '</td>'; });
      h += '<td class="sp">' + (chips || '<span class="none">–</span>') + '</td>' +
        '<td class="n"><span class="pill ' + (bad ? 'bad' : 'ok') + '">' + tot + '/' + cp + '</span></td></tr>';
      if (note) h += '<tr class="ntr"><td colspan="6"><div class="nt">📝 ' + esc(note) + '</div></td></tr>';
      h += '</tbody>';
    });
    h += '</table>';
    h += '</div>';
    h += '<button class="btn ghost" data-act="redistribute">Redistribute automatically</button>';
    return h;
  }

  /* Update numbers and labels in place, without rebuilding inputs (keeps the keyboard open). */
  function refresh(force) {
    var f = flight(); if (!f) return;
    var ae = document.activeElement;
    var t = totals(f);
    var el = document.getElementById('stdTotal'); if (el) el.textContent = t.A + t.B + t.C + toInt(f.spmlTotal);
    var h1 = app.querySelector('header.top h1'); if (h1) h1.textContent = f.flightNumber || 'New flight';

    var msg = document.getElementById('ccmsg');
    if (msg) {
      var m = '';
      if (f.generated && f.cartCount && f.cartCount !== f.carts.length) m = '<p class="hint">Press SAVE &amp; GENERATE CARTS to change from ' + f.carts.length + ' to ' + f.cartCount + ' carts.</p>';
      else if (!f.generated) m = '<p class="hint">Enter the number of carts, then press the button.</p>';
      msg.innerHTML = m;
    }
    if (!f.generated) return;

    var sum = document.getElementById('summary'); if (sum) sum.innerHTML = summaryHTML(f);
    f.carts.forEach(function (c, i) {
      var tot = cartTotal(c), cp = capOf(c), bad = tot > cp;
      var card = document.getElementById('cart-' + i); if (!card) return;
      card.classList.toggle('over', bad);
      var pill = document.getElementById('pill-' + i);
      pill.className = 'pill ' + (bad ? 'bad' : 'ok'); pill.textContent = tot + ' / ' + cp;
      document.getElementById('tot-' + i).textContent = tot;
      document.getElementById('foot-' + i).innerHTML = bad
        ? '<span class="red">Over by ' + (tot - cp) + '</span>'
        : '<span class="green">' + (cp - tot) + ' left</span>';
      card.querySelectorAll('[data-cl]').forEach(function (s) { s.textContent = cname(f, s.getAttribute('data-cl')); });
      card.querySelectorAll('input[data-f="std"]').forEach(function (inp) {
        if (force || inp !== ae) inp.value = toInt(c.std[inp.getAttribute('data-k')]);
      });
      card.querySelectorAll('input[data-f="spq"]').forEach(function (inp) {
        var s = c.specials[+inp.getAttribute('data-si')]; if (s && (force || inp !== ae)) inp.value = toInt(s.qty);
      });
    });
  }

  function autoDistribute(f) {
    var r = distribute(totals(f), f.carts);
    r.alloc.forEach(function (a, i) { f.carts[i].std = a; });
  }

  /* Read a numeric field: digits only, clamp to [0, max]. Rewrites the field only if needed. */
  function readNum(inp, max) {
    var raw = inp.value, digits = raw.replace(/\D/g, '');
    var v = digits === '' ? 0 : parseInt(digits, 10);
    if (v > max) v = max;
    var shown = digits === '' ? '' : String(v);
    if (shown !== raw) inp.value = shown;
    return v;
  }

  /* ---------- events ---------- */
  app.addEventListener('input', function (e) {
    var inp = e.target, f = flight(); if (!f || !inp.dataset || !inp.dataset.f) return;
    var k = inp.dataset.k, ci = +inp.dataset.ci, si = +inp.dataset.si, cart = f.carts[ci];
    switch (inp.dataset.f) {
      case 'fn': f.flightNumber = inp.value.toUpperCase().trim(); break;
      case 'fd': f.flightDate = inp.value; break;
      case 'cn': f.choices[k].name = inp.value; break;
      case 'spt': f.spmlTotal = readNum(inp, 999); break;
      case 'cq':
        f.choices[k].qty = readNum(inp, 9999);
        if (f.generated && f.autoMode) autoDistribute(f);
        break;
      case 'cc': f.cartCount = readNum(inp, 60); break;
      case 'cartname': cart.name = inp.value.toUpperCase(); break;
      case 'cartsel':
        if (inp.value === '__other') { cart.manualName = true; if (CART_NAMES.indexOf((cart.name || '').toUpperCase()) >= 0) cart.name = ''; }
        else { cart.manualName = false; cart.name = inp.value; }
        touch(f);
        redrawCartHeads(f, inp.value === '__other' ? ci : -1);
        refresh(false);
        return;
      case 'std':
        cart.std[k] = readNum(inp, manualMax(totals(f), f.carts, ci, k));
        f.autoMode = false;
        break;
      case 'notes': cart.notes = inp.value; break;
      case 'cap':
        cart.cap = toInt(inp.value) || CAP;
        if (f.autoMode) autoDistribute(f); else trimCart(cart);
        touch(f); redrawCart(f, ci); return;
      case 'rows':
        cart.rows = inp.value;
        var mate = f.carts[ci ^ 1];
        if (mate) {
          mate.rows = inp.value;
          var mi2 = document.querySelector('#cart-' + (ci ^ 1) + ' input[data-f="rows"]'); if (mi2) mi2.value = inp.value;
        }
        break;
      case 'spn': cart.specials[si].name = inp.value.toUpperCase().trim(); break;
      case 'spsel':
        var spx = cart.specials[si];
        if (inp.value === '__other') { spx.manualName = true; if (SP_NAMES.indexOf((spx.name || '').toUpperCase()) >= 0) spx.name = ''; }
        else { spx.manualName = false; spx.name = inp.value; }
        touch(f); redrawCart(f, ci);
        if (inp.value === '__other') { var mi = document.querySelector('#cart-' + ci + ' input[data-f="spn"][data-si="' + si + '"]'); if (mi) mi.focus(); }
        return;
      case 'spqsel':
        var spq = cart.specials[si];
        if (inp.value === '__other') spq.manualQty = true;
        else { spq.manualQty = false; spq.qty = Math.min(toInt(inp.value), specialMax(cart, si)); }
        if (f.autoMode) autoDistribute(f); else trimCart(cart);
        touch(f); redrawCart(f, ci);
        if (inp.value === '__other') { var qi = document.querySelector('#cart-' + ci + ' input[data-f="spq"][data-si="' + si + '"]'); if (qi) { qi.focus(); qi.select(); } }
        return;
      case 'spq':
        cart.specials[si].qty = readNum(inp, specialMax(cart, si));
        if (f.autoMode) autoDistribute(f); else trimCart(cart);
        break;
      default: return;
    }
    touch(f); refresh(false);
  });
  app.addEventListener('change', function (e) {
    if (e.target && e.target.dataset && e.target.dataset.f === 'cartname') { var fc = flight(); if (fc) redrawCartHeads(fc, -1); return; }
    if (e.target && e.target.classList && e.target.classList.contains('num')) {
      var f = flight();
      if (f && e.target.dataset.f === 'cq') e.target.value = toInt(f.choices[e.target.dataset.k].qty);
      refresh(true);
    }
  });

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'authform') emailSubmit(e.target);
    else if (e.target.id === 'newpwform') newPasswordSubmit(e.target);
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act, f = flight();
    if (act === 'signin') return signIn();
    if (act === 'mode-signin' || act === 'mode-signup' || act === 'mode-reset') {
      var em = document.querySelector('#authform input[name=email]'); if (em) auth.email = em.value.trim();
      auth.mode = act.slice(5); acct.note = ''; auth.info = ''; renderStart(); return;
    }
    if (act === 'signout') return signOut();
    if (act === 'retry') { location.reload(); return; }
    if (!canUse()) return renderStart();
    if (act === 'start') {
      var lastId = getLast();
      if (lastId && store.flights[lastId]) { curId = lastId; renderFlight(); window.scrollTo(0, 0); } else renderHome();
      return;
    }
    if (act === 'new') { var nf = newFlight(); store.flights[nf.id] = nf; curId = nf.id; setLast(nf.id); touch(nf); renderFlight(); window.scrollTo(0, 0); return; }
    if (act === 'open') { curId = b.dataset.id; setLast(curId); renderFlight(); window.scrollTo(0, 0); return; }
    if (act === 'home') { renderHome(); return; }
    if (act === 'delflight') {
      var df = store.flights[b.dataset.id];
      ask('Delete flight ' + (df.flightNumber || 'Untitled') + ' (' + fmtDate(df.flightDate) + ')? This cannot be undone.', 'Delete', function () {
        delete store.flights[df.id];
        if (store.deleted.indexOf(df.id) < 0) store.deleted.push(df.id);
        saveLocal(); cloudWrite(df.id); renderHome();
      }, true);
      return;
    }
    if (!f) return;
    if (act === 'generate') return generate(f);
    if (act === 'redistribute') {
      var go = function () { f.autoMode = true; autoDistribute(f); touch(f); refresh(true); };
      if (!f.autoMode) ask('Redistribute all standard meals automatically? Your manual changes to Choice A, B and C in the carts will be replaced. Special meals stay where they are.', 'Redistribute', go);
      else go();
      return;
    }
    if (act === 'addsp') {
      var ci = +b.dataset.ci, cc = f.carts[ci];
      cc.specials.push({ id: uid('s'), name: '', qty: 0 });
      cc.specials[cc.specials.length - 1].qty = Math.min(1, specialMax(cc, cc.specials.length - 1));
      if (f.autoMode) autoDistribute(f); else trimCart(cc);
      touch(f); redrawCart(f, ci);
      return;
    }
    if (act === 'delsp') {
      var c2 = +b.dataset.ci; f.carts[c2].specials.splice(+b.dataset.si, 1);
      if (f.autoMode) autoDistribute(f);
      touch(f); redrawCart(f, c2); return;
    }
  });

  function redrawCartHeads(f, focusCi) {
    f.carts.forEach(function (c, i) {
      var head = document.querySelector('#cart-' + i + ' .cart-head'); if (!head) return;
      var pill = document.getElementById('pill-' + i);
      head.innerHTML = cartNameHTML(f, i);
      if (pill) head.appendChild(pill);
    });
    if (focusCi >= 0) { var t = document.querySelector('#cart-' + focusCi + ' input[data-f="cartname"]'); if (t) t.focus(); }
  }
  function redrawCart(f, ci) {
    var old = document.getElementById('cart-' + ci); if (!old) return;
    var tmp = document.createElement('div'); tmp.innerHTML = cartHTML(f, ci);
    old.replaceWith(tmp.firstChild);
    refresh(true);
  }

  function generate(f) {
    var n = toInt(f.cartCount);
    var msg = document.getElementById('ccmsg');
    if (n < 1) { msg.innerHTML = '<p class="err">Enter how many carts you need (1–60).</p>'; document.getElementById('cc').focus(); return; }
    var removed = f.carts.slice(n);
    var removedHasData = removed.some(function (c) { return (c.name || '').trim() || c.specials.length; });
    var go = function () {
      while (f.carts.length < n) { var nc = newCart(), pm = f.carts[f.carts.length ^ 1]; if (pm && pm.rows) nc.rows = pm.rows; f.carts.push(nc); }
      f.carts.length = n;
      f.generated = true; f.autoMode = true;
      autoDistribute(f); touch(f);
      var y = window.scrollY; renderFlight(); window.scrollTo(0, y);
      var s = document.getElementById('summary'); if (s) s.scrollIntoView({ block: 'start' });
    };
    if (removedHasData) ask('Going to ' + n + ' carts removes ' + removed.length + ' cart(s), including their names and special meals. Continue?', 'Remove carts', go, true);
    else if (f.generated && !f.autoMode) ask('This will redistribute all standard meals and replace your manual changes. Special meals stay where they are.', 'Generate', go);
    else go();
  }

  /* ---------- start ---------- */
  if (!CONFIGURED) loadLocal();
  renderStart();
  initAuth();
})();
</script>
</body>
</html>
